name: plantsai
description: Plants AI — rozpoznawanie roślin, porady i plan podlewania.
publish_to: none
version: 2.0.0+34

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Wspólny backend Convex (OpenAI, kredyty, Pro) — prywatne repo JakubJakubiak/ai-hub.
  # Lokalną kopię klienta podłączysz przez pubspec_overrides.yaml (patrz README).
  ai_hub_client:
    git:
      url: https://github.com/JakubJakubiak/ai-hub.git
      path: clients/dart
      ref: main

  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  drift: ^2.25.1
  drift_flutter: ^0.2.4
  # Firebase zostaje tylko do analityki (aktywność, statystyki).
  firebase_analytics: ^11.4.4
  firebase_core: ^3.12.1
  flutter_animate: ^4.5.2
  flutter_markdown_plus: ^1.0.3
  google_mobile_ads: ^6.0.0
  image_cropper: ^9.1.0
  image_picker: ^1.1.2
  in_app_review: ^2.0.9
  intl: any
  mobile_device_identifier:
    git:
      url: https://github.com/Tughra/mobile_device_identifier.git
      ref: master
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  purchases_flutter: ^8.6.0
  share_plus: ^11.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.11
  drift_dev: ^2.25.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/logoIcon/icon.png
    - assets/data/plants_library.json

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/logoIcon/icon.png"
